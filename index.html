<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock Paper Scissors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1b2f; --sun:#ffd93d; --paper:#fff8e1;
  --rock:#ff5c5c; --paperc:#4cc9f0; --scissors:#7ae582; --grape:#8b5cf6;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
  background:var(--sun); color:var(--ink);
  background-image:radial-gradient(var(--ink) 1.5px, transparent 1.5px);
  background-size:26px 26px; background-position:0 0;
  font-family:"Nunito",system-ui,sans-serif; font-weight:900;
}
.game{
  width:min(560px,100%); background:var(--paper);
  border:5px solid var(--ink); border-radius:28px;
  box-shadow:10px 10px 0 var(--ink); padding:26px 22px; text-align:center;
}
h1{
  font-family:"Lilita One",system-ui,sans-serif; font-weight:400;
  font-size:clamp(2rem,8vw,3rem); margin:0 0 18px; line-height:1;
  color:var(--grape); -webkit-text-stroke:2px var(--ink);
  text-shadow:4px 4px 0 var(--ink); letter-spacing:1px;
}
.scoreboard{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.score{border:4px solid var(--ink); border-radius:18px; padding:8px 4px; box-shadow:4px 4px 0 var(--ink)}
.score span{display:block; font-size:.95rem}
.score b{font-family:"Lilita One",sans-serif; font-weight:400; font-size:2.4rem; line-height:1}
.score.you{background:var(--scissors)} .score.tie{background:#fff} .score.cpu{background:var(--rock)}

.arena{display:flex; align-items:center; justify-content:center; gap:14px; margin:24px 0 10px}
.hand{
  width:clamp(90px,28vw,130px); aspect-ratio:1; display:grid; place-items:center;
  font-size:clamp(3rem,13vw,4.8rem); background:#fff;
  border:5px solid var(--ink); border-radius:50%; box-shadow:6px 6px 0 var(--ink);
}
.vs{font-family:"Lilita One",sans-serif; font-size:1.6rem; background:var(--ink); color:var(--sun); padding:6px 12px; border-radius:12px; transform:rotate(-6deg)}
.hand.shake{animation:shake .6s ease-in-out}
@keyframes shake{
  0%,100%{transform:translateY(0) rotate(0)}
  20%,60%{transform:translateY(-18px) rotate(-12deg)}
  40%,80%{transform:translateY(6px) rotate(10deg)}
}
.hand.win{background:var(--scissors)} .hand.lose{background:var(--rock)}

.message{
  min-height:3.2rem; margin:14px 0 18px; font-size:1.25rem;
  display:flex; align-items:center; justify-content:center;
}
.message.win{color:#138a36} .message.lose{color:#c4161c} .message.tie{color:var(--grape)}

.choices{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.choice{
  font:inherit; font-size:1.05rem; color:var(--ink); cursor:pointer;
  border:5px solid var(--ink); border-radius:22px; padding:12px 4px;
  box-shadow:6px 6px 0 var(--ink); transition:transform .1s, box-shadow .1s;
}
.choice span{display:block; font-size:clamp(2.2rem,9vw,3.2rem); margin-bottom:2px}
.choice.rock{background:var(--rock)} .choice.paper{background:var(--paperc)} .choice.scissors{background:var(--scissors)}
.choice:hover{transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--ink)}
.choice:active{transform:translate(5px,5px); box-shadow:1px 1px 0 var(--ink)}
.choice:disabled{opacity:.5; cursor:not-allowed; transform:none; box-shadow:6px 6px 0 var(--ink)}

.reset{
  margin-top:22px; font:inherit; font-size:1.05rem; cursor:pointer;
  background:var(--grape); color:#fff; border:4px solid var(--ink);
  border-radius:14px; padding:10px 22px; box-shadow:4px 4px 0 var(--ink);
}
.reset:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
:focus-visible{outline:4px solid var(--grape); outline-offset:3px}
@media (prefers-reduced-motion:reduce){.hand.shake{animation:none}}

</style>
</head>
<body>
<main class="game">
  <h1>Rock Paper Scissors</h1>

  <section class="scoreboard" aria-live="polite">
    <div class="score you"><span>User</span><b id="playerScore">0</b></div>
    <div class="score tie"><span>Ties</span><b id="tieScore">0</b></div>
    <div class="score cpu"><span>Computer</span><b id="cpuScore">0</b></div>
  </section>

  <section class="arena">
    <div class="hand" id="playerHand">❔</div>
    <div class="vs">VS</div>
    <div class="hand" id="cpuHand">❔</div>
  </section>

  <p class="message" id="message">Enter your move: Rock, Paper or Scissors</p>

  <section class="choices">
    <button class="choice rock" data-move="Rock"><span>✊</span>Rock</button>
    <button class="choice paper" data-move="Paper"><span>✋</span>Paper</button>
    <button class="choice scissors" data-move="Scissors"><span>✌️</span>Scissors</button>
  </section>

  <button class="reset" id="reset">Reset score</button>
</main>
<script>
const EMOJI = { Rock: "✊", Paper: "✋", Scissors: "✌️" };
const ITEM_LIST = ["Rock", "Paper", "Scissors"];

// Same win messages as the Python version
const RESULTS = {
  "Rock-Paper":     ["Paper covers Rock = Computer wins", "cpu"],
  "Rock-Scissors":  ["Rock smashes Scissors = User wins", "user"],
  "Paper-Scissors": ["Scissors cuts Paper = Computer wins", "cpu"],
  "Paper-Rock":     ["Paper covers Rock = User wins", "user"],
  "Scissors-Rock":  ["Rock smashes Scissors = Computer wins", "cpu"],
  "Scissors-Paper": ["Scissors cuts Paper = User wins", "user"],
};

const scores = { user: 0, cpu: 0, tie: 0 };
let busy = false;

const $ = (id) => document.getElementById(id);
const userHand = $("playerHand"), cpuHand = $("cpuHand"), message = $("message");
const buttons = document.querySelectorAll(".choice");

function setMessage(text, cls = "") {
  message.textContent = text;
  message.className = "message " + cls;
}

function render() {
  $("playerScore").textContent = scores.user;
  $("cpuScore").textContent = scores.cpu;
  $("tieScore").textContent = scores.tie;
}

function play(userChoice) {
  if (busy) return;
  busy = true;
  buttons.forEach((b) => (b.disabled = true));
  userHand.className = cpuHand.className = "hand shake";
  userHand.textContent = cpuHand.textContent = "✊";
  setMessage("Rock... paper... scissors...");

  setTimeout(() => {
    const compChoice = ITEM_LIST[Math.floor(Math.random() * ITEM_LIST.length)];
    userHand.textContent = EMOJI[userChoice];
    cpuHand.textContent = EMOJI[compChoice];
    userHand.className = cpuHand.className = "hand";

    if (userChoice === compChoice) {
      scores.tie++;
      setMessage("Both chooses same = Match Tie", "tie");
    } else {
      const [text, winner] = RESULTS[`${userChoice}-${compChoice}`];
      scores[winner]++;
      const [w, l] = winner === "user" ? [userHand, cpuHand] : [cpuHand, userHand];
      w.classList.add("win");
      l.classList.add("lose");
      setMessage(text, winner === "user" ? "win" : "lose");
    }
    render();
    busy = false;
    buttons.forEach((b) => (b.disabled = false));
  }, 700);
}

function reset() {
  scores.user = scores.cpu = scores.tie = 0;
  busy = false;
  render();
  buttons.forEach((b) => (b.disabled = false));
  userHand.className = cpuHand.className = "hand";
  userHand.textContent = cpuHand.textContent = "❔";
  setMessage("Enter your move: Rock, Paper or Scissors");
}

buttons.forEach((b) => b.addEventListener("click", () => play(b.dataset.move)));
$("reset").addEventListener("click", reset);

</script>
</body>
</html>
